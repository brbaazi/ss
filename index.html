<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ArabeTrading — روابط التداول الرسمية</title>
<meta name="description" content="ابدأ رحلتك في التداول مع شركائنا الموثوقين. قناة تيليجرام وحسابات الوساطة الرسمية." />
<meta name="theme-color" content="#000000" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
/* ============================================================
   1. المتغيرات (Variables)
   ============================================================ */
:root{
  /* الألوان */
  --black:#000000;
  --green:#7ed957;
  --white:#ffffff;

  /* اشتقاقات اللون الأخضر */
  --green-soft:rgba(126,217,87,.12);
  --green-line:rgba(126,217,87,.28);
  --green-glow:rgba(126,217,87,.35);

  /* الأسطح الزجاجية */
  --glass:rgba(255,255,255,.045);
  --glass-hover:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.1);
  --muted:rgba(255,255,255,.58);

  /* الخط والشكل */
  --font:'Tajawal',system-ui,'Segoe UI',sans-serif;
  --radius:20px;
  --radius-pill:999px;

  /* الحركة */
  --ease:cubic-bezier(.22,1,.36,1);
  --fast:.2s;
}

/* ============================================================
   2. الأساسيات (Reset)
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:3rem 1.25rem;
  font-family:var(--font);
  color:var(--white);
  background:var(--black);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* توهج أخضر خفيف في الخلفية */
body::before,body::after{
  content:"";
  position:fixed;
  border-radius:50%;
  filter:blur(100px);
  pointer-events:none;
  z-index:0;
}
body::before{
  top:-16vh;left:50%;transform:translateX(-50%);
  width:min(34rem,95vw);height:min(34rem,95vw);
  background:radial-gradient(circle,var(--green-glow),transparent 68%);
  opacity:.55;
}
body::after{
  bottom:-20vh;left:-10vw;
  width:min(24rem,80vw);height:min(24rem,80vw);
  background:radial-gradient(circle,#0b1408,transparent 70%);
}

/* ============================================================
   3. الهيكل العام
   ============================================================ */
.wrap{
  position:relative;
  z-index:1;
  width:100%;
  max-width:30rem;
  text-align:center;
}

/* ============================================================
   4. الشعار والعنوان
   ============================================================ */
.logo-ring{
  width:112px;height:112px;
  margin:0 auto 1.4rem;
  display:grid;place-items:center;
  border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 55%,var(--green) 80%,transparent 100%);
  animation:spin 8s linear infinite;
}

.logo{
  width:104px;height:104px;
  display:grid;place-items:center;
  overflow:hidden;
  background:var(--black);
  border-radius:50%;
  animation:spin-back 8s linear infinite;
}

/* استبدل هذا النص بصورة الشعار: <img src="logo.png" alt="ArabeTrading"> */
.logo span{font-size:1.9rem;font-weight:700;color:var(--green);letter-spacing:-.02em}
.logo img{width:100%;height:100%;object-fit:cover}

h1{
  font-size:clamp(1.9rem,7vw,2.4rem);
  font-weight:700;
  letter-spacing:-.02em;
  direction:ltr;
}

.desc{
  max-width:24rem;
  margin:.6rem auto 0;
  font-size:1rem;
  color:var(--muted);
}

/* ============================================================
   5. بطاقة اسم المستخدم
   ============================================================ */
.card{
  margin-top:2rem;
  padding:1rem 1.1rem;
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:var(--radius);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  text-align:right;
}

.card__label{
  font-size:.8rem;
  font-weight:500;
  color:var(--muted);
}

.card__row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:.75rem;
  margin-top:.35rem;
}

.card__value{
  direction:ltr;
  font-size:1.15rem;
  font-weight:500;
  color:var(--green);
  overflow-wrap:anywhere;
}

.copy{
  flex-shrink:0;
  padding:.5rem 1.1rem;
  font-size:.9rem;
  font-weight:700;
  color:var(--black);
  background:var(--green);
  border-radius:var(--radius-pill);
  transition:transform var(--fast) var(--ease),box-shadow var(--fast) var(--ease);
}
.copy:hover{transform:translateY(-2px);box-shadow:0 0 0 5px var(--green-soft)}
.copy:active{transform:scale(.94)}
.copy.done{background:transparent;color:var(--green);box-shadow:inset 0 0 0 1px var(--green-line)}

/* ============================================================
   6. الأزرار الكبيرة
   ============================================================ */
.links{
  display:flex;
  flex-direction:column;
  gap:.85rem;
  margin-top:1.1rem;
}

.btn{
  position:relative;
  overflow:hidden;
  display:block;
  padding:1.1rem 1.25rem;
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:var(--radius);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  transition:transform var(--fast) var(--ease),
             background var(--fast) var(--ease),
             border-color var(--fast) var(--ease),
             box-shadow var(--fast) var(--ease);
}

/* لمعة تمر فوق الزر عند المرور بالمؤشر */
.btn::before{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 25%,var(--green-soft) 50%,transparent 75%);
  transform:translateX(100%);
  opacity:0;
  transition:transform .75s var(--ease),opacity .2s var(--ease);
}
.btn:hover::before{transform:translateX(-100%);opacity:1}

.btn:hover{
  transform:translateY(-3px);
  background:var(--glass-hover);
  border-color:var(--green-line);
  box-shadow:0 0 28px -8px var(--green-glow);
}
.btn:active{transform:scale(.98)}

.btn__title{
  display:block;
  font-size:1.05rem;
  font-weight:700;
}

.btn__note{
  display:block;
  margin-top:.15rem;
  font-size:.85rem;
  font-weight:400;
  color:var(--muted);
}

/* الزر المميّز */
.btn--primary{
  border-color:var(--green-line);
  box-shadow:0 0 24px -12px var(--green-glow);
}

/* ============================================================
   7. التذييل
   ============================================================ */
footer{
  margin-top:2.5rem;
  padding-top:1.25rem;
  border-top:1px solid var(--border);
  font-size:.85rem;
  color:var(--muted);
}

/* ============================================================
   8. الحركات
   ============================================================ */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spin-back{to{transform:rotate(-360deg)}}
@keyframes fade-up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

.reveal{
  opacity:0;
  animation:fade-up .65s var(--ease) forwards;
  animation-delay:var(--delay,0ms);
}

/* ============================================================
   9. الوصولية والاستجابة
   ============================================================ */
:focus-visible{outline:2px solid var(--green);outline-offset:3px}

.sr-only{
  position:absolute;width:1px;height:1px;
  overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;
}

@media (max-width:380px){
  .card__value{font-size:1rem}
  .btn{padding:1rem}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .reveal{opacity:1;transform:none}
}
</style>
</head>

<body>
<main class="wrap">

  <!-- الشعار والعنوان -->
  <header class="reveal" style="--delay:0ms">
    <div class="logo-ring">
      <div class="logo"><span>AT</span></div>
    </div>
    <h1>ArabeTrading</h1>
    <p class="desc">ابدأ رحلتك في التداول مع شركائنا الموثوقين.</p>
  </header>

  <!-- اسم مستخدم تيليجرام -->
  <section class="card reveal" style="--delay:100ms" aria-labelledby="tgLabel">
    <p class="card__label" id="tgLabel">اسم المستخدم على تيليجرام</p>
    <div class="card__row">
      <span class="card__value" id="tgUser">@ArabeTrading</span>
      <button class="copy" id="copyBtn" type="button" aria-label="نسخ اسم المستخدم">نسخ</button>
    </div>
    <p class="sr-only" id="copyStatus" role="status" aria-live="polite"></p>
  </section>

  <!-- الروابط -->
  <nav class="links" aria-label="روابط ArabeTrading">

    <a class="btn btn--primary reveal" style="--delay:180ms" href="#">
      <span class="btn__title">📲 الانضمام إلى قناة تيليجرام</span>
    </a>

    <a class="btn reveal" style="--delay:240ms" href="#">
      <span class="btn__title">⭐ افتح حساب Exness</span>
      <span class="btn__note">أفضل وسيط للتداول.</span>
    </a>

    <a class="btn reveal" style="--delay:300ms" href="#">
      <span class="btn__title">⭐ افتح حساب JustMarkets</span>
      <span class="btn__note">أفضل وسيط للتداول.</span>
    </a>

  </nav>

  <footer class="reveal" style="--delay:360ms">© 2026 ArabeTrading</footer>
</main>

<script>
/* نسخ اسم المستخدم إلى الحافظة */
(function () {
  "use strict";

  var btn    = document.getElementById("copyBtn");
  var user   = document.getElementById("tgUser");
  var status = document.getElementById("copyStatus");
  var timer;

  /* طريقة احتياطية للمتصفحات القديمة أو الصفحات غير المؤمّنة */
  function fallbackCopy(text) {
    var field = document.createElement("textarea");
    field.value = text;
    field.setAttribute("readonly", "");
    field.style.position = "fixed";
    field.style.opacity = "0";
    document.body.appendChild(field);
    field.select();

    var ok;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }

    document.body.removeChild(field);
    return ok;
  }

  /* إظهار النتيجة على الزر وإعلانها لقارئ الشاشة */
  function showResult(ok) {
    btn.textContent = ok ? "تم النسخ" : "انسخ يدويًا";
    btn.classList.add("done");
    status.textContent = ok ? "تم نسخ اسم المستخدم" : "تعذّر النسخ، حدّد الاسم وانسخه يدويًا";

    clearTimeout(timer);
    timer = setTimeout(function () {
      btn.textContent = "نسخ";
      btn.classList.remove("done");
      status.textContent = "";
    }, 2000);
  }

  btn.addEventListener("click", function () {
    var text = user.textContent.trim();

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        function () { showResult(true); },
        function () { showResult(fallbackCopy(text)); }
      );
    } else {
      showResult(fallbackCopy(text));
    }
  });
})();
</script>
</body>
</html>
